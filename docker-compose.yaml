version: '3.5'

services:
  db_auth:
    container_name: db_auth
    ports:
      - "5000:5432"
    environment:
      - POSTGRES_PASSWORD=root
      - POSTGRES_USER=admin
      - POSTGRES_DB=postgres
    image: postgres:14.19
    networks:
      - my_network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgrest:
    image: postgrest/postgrest
    container_name: postgrest_api
    ports:
      - "3000:3000"
    environment:
      - PGRST_DB_URI=postgres://admin:root@db_auth:5432/postgres
      - PGRST_DB_SCHEMA=public
      - PGRST_DB_ANON_ROLE=admin
      - PGRST_OPENAPI_SERVER_PROXY_URI=http://10.174.130.148:8888/api
      - PGRST_DB_USE_LEGACY_GUCS=false
    depends_on:
      - db_auth
    networks:
      - my_network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "8888:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./html:/usr/share/nginx/html
    depends_on:
      - db_auth
      - postgrest
    networks:
      - my_network

networks:
  my_network:
    driver: bridge

volumes:
  postgres_data:
