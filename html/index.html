<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление картриджами</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .company-btn, .tab-btn {
            padding: 8px 16px;
            margin: 4px;
            border: 1px solid #ccc;
            background: #f0f0f0;
            cursor: pointer;
            border-radius: 4px;
        }
        .company-btn.active, .tab-btn.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }
        .tab-content {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        table { border-collapse: collapse; width: 100%; }
        th, td { padding: 8px; text-align: left; }
        button { margin: 2px; }
    </style>
</head>
<body>
    <h1>Управление картриджами</h1>
    <!-- Блок переключения компаний -->
    <div id="company-switcher">
        <button class="company-btn" data-company-id="1">Компания А</button>
        <button class="company-btn" data-company-id="2">Компания Б</button>
    </div>
    <!-- Навигация по вкладкам -->
    <nav>
        <button class="tab-btn" data-tab="main">Главная</button>
        <button class="tab-btn" data-tab="cartridges">Картриджи</button>
        <button class="tab-btn" data-tab="reports">Отчёты</button>
    </nav>
    <!-- Секции вкладок -->
    <section id="tab-main" class="tab-content">Загрузка...</section>
    <section id="tab-cartridges" class="tab-content" style="display:none;">Загрузка...</section>
    <section id="tab-reports" class="tab-content" style="display:none;">Загрузка...</section>
    <script src="app.js"></script>
</body>
</html>
