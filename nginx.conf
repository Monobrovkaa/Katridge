events {
    worker_connections 1024;
}

http {
    charset utf-8;
    charset_types text/html text/css text/plain application/json;

    # Настройки CORS
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, Prefer" always;
    add_header Access-Control-Expose-Headers "Content-Range" always;

    server {
        listen 80;  # Внутренний порт nginx (внешний 8888 мапится на этот)
        server_name 10.174.130.148;

        # Обработка preflight запросов
        location /api/ {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, Prefer";
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            proxy_pass http://postgrest:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Проксирование заголовков для PostgREST
            proxy_set_header Prefer $http_prefer;
        }

        location ~ \.html$ {
            root /usr/share/nginx/html;
            index index.html;
            add_header Content-Type "text/html; charset=utf-8";
        }

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ =404;
            add_header Content-Type "text/html; charset=utf-8";
        }
    }
}
